name: Tests

# Pull requests (and pushes to main): the test suite and a Lua syntax check, on GitHub's own runners only.
# This repo is open to outside contributions, so this workflow:
#   - runs on `pull_request` only (never `pull_request_target`), so a fork's PR gets a read-only token and no secrets;
#   - uses no secrets at all, and asks for `contents: read` and nothing more;
#   - runs on `ubuntu-latest`, never on a self-hosted runner;
#   - pins every action to a full commit sha.
# It builds nothing, releases nothing and deploys nothing. Changes to this file get a maintainer's look before merging.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"

      - name: Install the dev tools (app/pyproject.toml, with dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "app[dev]"
          python -P -c "import lupa, lupa.lua51; print('lupa', lupa.__version__)"

      - name: python -m pytest
        working-directory: app
        run: python -P -m pytest -q -rs -n auto --dist loadfile

  luacheck:
    name: luacheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Install luacheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lua-check

      - name: luacheck (syntax errors in the addon's Lua)
        # (WoW's API is all globals, so only errors fail the check; the generated Data/ files are checked too)
        run: luacheck addon --no-config --std lua51 --codes --no-color --only 0 --formatter plain
